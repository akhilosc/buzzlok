<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e"/>
      <stop offset="50%" stop-color="#121319"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="buzz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Radial Glow Behind Brand -->
  <circle cx="280" cy="200" r="220" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>
  <circle cx="950" cy="380" r="260" fill="#38bdf8" opacity="0.10" filter="url(#glow)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 80)">
    <rect width="320" height="42" rx="21" fill="#1f222e" stroke="#2d3245" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="5" fill="#10b981"/>
    <text x="40" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="1">LIVE AI RADAR · DISCOVERY ENGINE</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(80, 180)">
    <!-- Zap Logo Icon -->
    <rect width="70" height="70" rx="20" fill="url(#buzz)"/>
    <path d="M38 18 L22 38 L34 38 L30 54 L48 32 L36 32 Z" fill="#0a0b0e"/>

    <!-- Buzzlok AI text -->
    <text x="90" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#ffffff">
      Buzz<tspan fill="#f59e0b">lok</tspan> <tspan fill="#38bdf8" font-size="38">AI</tspan>
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 320)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', sans-serif" font-size="58" font-weight="800" fill="#ffffff">
      Find the <tspan fill="url(#buzz)">Intelligence</tspan> That Moves Your World.
    </text>
    <text y="68" font-family="-apple-system, BlinkMacSystemFont, 'DM Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
      Search verified AI tools, autonomous agents, and foundation models built for your workflow.
    </text>
  </g>

  <!-- Popular Tasks Cloud in OG Image -->
  <g transform="translate(80, 470)">
    <rect x="0" y="0" width="180" height="46" rx="23" fill="#1a1d26" stroke="#2d3245"/>
    <text x="24" y="29" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff">💻 Coding Agents</text>

    <rect x="195" y="0" width="195" height="46" rx="23" fill="#1a1d26" stroke="#2d3245"/>
    <text x="219" y="29" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff">🧠 Deep Reasoning</text>

    <rect x="405" y="0" width="190" height="46" rx="23" fill="#1a1d26" stroke="#2d3245"/>
    <text x="429" y="29" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff">🎬 Generative Video</text>

    <rect x="610" y="0" width="170" height="46" rx="23" fill="#1a1d26" stroke="#2d3245"/>
    <text x="634" y="29" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff">🎙️ Voice Cloning</text>

    <rect x="795" y="0" width="180" height="46" rx="23" fill="#1a1d26" stroke="#2d3245"/>
    <text x="819" y="29" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff">🌐 Open Weights</text>
  </g>
</svg>
